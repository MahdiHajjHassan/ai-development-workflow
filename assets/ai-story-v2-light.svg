<title id="aiTitle">Agent responsibilities share a brief, while a human owns acceptance</title>
<desc id="aiDesc">Workflow concept, separate from the final-year orchestration project. Product planning, delivery planning, technical review, implementation, and quality review share a task brief and decisions. Review can request revision; the human owner accepts or defers. No checks or automation are claimed to have executed.</desc>
