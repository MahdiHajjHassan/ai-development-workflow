<svg xmlns="http://www.w3.org/2000/svg" width="320" height="304" viewBox="0 0 320 304" role="img" aria-labelledby="ai-title ai-description">
  <title id="ai-title">The context travels with the task</title>
  <desc id="ai-description">Concept illustration of an AI-assisted task passing a brief, a scoped change, and review evidence between responsibilities, with a human decision. Documentation example, not executed automation.</desc>
  <style>text{font-family:Segoe UI,Arial,sans-serif;font-size:26px;font-weight:500;fill:#24313b}.small{font-size:21px;font-weight:400}.paper{fill:#ffffff;stroke:#d9dedb;stroke-width:1.5}.flow{stroke:#bb642e;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.rule{stroke:#d9dedb;stroke-width:2;fill:none}</style>
  <rect width="320" height="304" rx="14" fill="#faf8f3"/>

  <rect x="16" y="15" width="288" height="65" rx="10" class="paper"/>
  <rect x="16" y="98" width="288" height="65" rx="10" class="paper"/>
  <rect x="16" y="181" width="288" height="65" rx="10" class="paper"/>
  <text x="32" y="45">Brief</text>
  <text class="small" x="32" y="69">Purpose + scope</text>
  <text x="32" y="128">Build</text>
  <text class="small" x="32" y="152">Change + work record</text>
  <text x="32" y="211">Review</text>
  <text class="small" x="32" y="235">Checks + remaining gaps</text>
  <path d="M279 57V122 M274 116L279 122L284 116 M279 140V206 M274 200L279 206L284 200" class="flow"/>
  <text class="small" x="32" y="282">Human owns the decision.</text>
</svg>
