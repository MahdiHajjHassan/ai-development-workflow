<title id="aiTitle">AI software delivery: requirements, code changes, review, and human approval</title>
<desc id="aiDesc">A feature request becomes a shared plan and task brief. Implementation produces code changes, quality review returns findings, and a product owner approves the change or requests a revision that returns to implementation.</desc>
